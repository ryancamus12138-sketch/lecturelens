<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>课堂笔记</title>
<link rel="stylesheet" href="lib/katex/katex.min.css">
<style>
body{max-width:820px;margin:24px auto;padding:0 18px;font:14.5px/1.7 system-ui,"PingFang SC","Microsoft YaHei",sans-serif;color:#1d1f23}
h1{font-size:23px}h2{font-size:16.5px;margin-top:26px;border-bottom:1px solid #ddd;padding-bottom:4px}h3,h4{font-size:15px;margin:12px 0 4px}
img{max-width:48.5%;max-height:330px;vertical-align:top;border:1px solid #ddd;border-radius:6px;margin:8px 8px 0 0}
code{background:#eef2ff;padding:0 4px;border-radius:4px}pre{background:#eef2ff;padding:10px;border-radius:6px;white-space:pre-wrap}
.src{color:#777;font-size:12.5px;word-break:break-all}a{color:#2563eb;text-decoration:none}
#tip{position:sticky;top:0;background:#fff6e5;color:#92400e;padding:9px 12px;border-radius:8px;font-size:13.5px;display:flex;gap:10px;align-items:center}
#tip button{font:inherit;padding:4px 12px;border:1px solid #d97706;background:#fff;border-radius:6px;cursor:pointer}
table{border-collapse:collapse;margin:10px 0;font-size:13.5px}th,td{border:1px solid #bbb;padding:5px 9px;text-align:left;vertical-align:top}th{background:#f3f4f6}
.katex-display{margin:10px 0;overflow-x:auto;overflow-y:hidden}
h2,h3,h4{break-after:avoid}img,li,tr,.katex-display{break-inside:avoid}
@media print{#tip{display:none}body{margin:0;max-width:none}@page{margin:16mm 14mm}}
</style>
</head>
<body>
<div id="tip"><span id="tipText">In the print dialog choose <b>Save as PDF</b> as the destination. Timestamps in the PDF are clickable and jump back to that moment in the recording (in a Chrome that has LectureLens installed).</span><button id="again">Print / Save as PDF</button></div>
<main id="doc"></main>
<script src="export.js"></script>
</body>
</html>
